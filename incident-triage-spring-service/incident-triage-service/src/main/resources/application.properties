spring.application.name=incident-triage-service

# Local-only overrides (e.g. your DB password) live in application-local.properties,
# which is git-ignored. In Docker/production everything comes from environment variables.
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL -- same DB as the Python service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/triage_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Python AI service
python.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}
server.port=${PORT:8080}

# JWT -- always set JWT_SECRET in production (openssl rand -base64 64)
jwt.secret=${JWT_SECRET:changeThisSecretKeyBeforeDeployingIncidentSenseToProd123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (comma-separated). Not needed when the dashboard is served through the bundled nginx proxy.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Seed admin/analyst/viewer demo accounts (password123). Set to false for a real deployment.
app.seed-demo-users=${SEED_DEMO_USERS:true}
