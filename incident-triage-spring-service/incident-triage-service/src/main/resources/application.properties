spring.application.name=incident-triage-service

# PostgreSQL connection -- same DB as Python service
spring.datasource.url=jdbc:postgresql://localhost:5432/triage_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379
python.service.url=http://localhost:8000
server.port=8080
# JWT
jwt.secret=${JWT_SECRET:changeThisSecretKeyBeforeDeployingIncidentSenseToProd123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

