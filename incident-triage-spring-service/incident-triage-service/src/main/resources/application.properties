spring.application.name=incident-triage-service

# Local-only overrides (e.g. your DB password) live in application-local.properties,
# which is git-ignored. In Docker/production everything comes from environment variables.
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL -- same DB as the Python service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/triage_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Python AI service
python.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}
# Redis list used as the triage queue
app.queue-key=${QUEUE_KEY:alert_queue}
# Parallel triage workers draining the queue
app.queue.consumers=${QUEUE_CONSUMERS:4}
# Max wait for one AI triage call; in-flight alerts idle longer than stale-after are re-queued
app.triage.timeout-seconds=${TRIAGE_TIMEOUT_SECONDS:90}
app.queue.stale-after-seconds=${QUEUE_STALE_AFTER_SECONDS:300}
app.queue.sweep-interval-seconds=${QUEUE_SWEEP_INTERVAL_SECONDS:30}

# Alert ingestion rate limit, per authenticated client (alerts/minute, also the burst size)
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:60}
server.port=${PORT:8080}

# JWT -- always set JWT_SECRET in production (openssl rand -base64 64)
jwt.secret=${JWT_SECRET:changeThisSecretKeyBeforeDeployingIncidentSenseToProd123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (comma-separated). Not needed when the dashboard is served through the bundled nginx proxy.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Seed admin/analyst/viewer demo accounts (password123). Set to false for a real deployment.
app.seed-demo-users=${SEED_DEMO_USERS:true}
