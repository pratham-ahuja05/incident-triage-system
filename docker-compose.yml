# Whole stack in one command:  docker compose up -d --build
# Then open http://localhost (or WEB_PORT). Configure secrets in .env (see .env.example).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: triage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/triage_db
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: ./incident-triage-spring-service/incident-triage-service
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/triage_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      PYTHON_SERVICE_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy

  web:
    build:
      context: ./dashboard
      args:
        VITE_DEMO_LOGIN: ${SEED_DEMO_USERS:-true}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
